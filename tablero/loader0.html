<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animación de Carga en Pantalla Completa</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .skeleton-loader {
      width: 100vw;
      height: 100vh;
      background: linear-gradient(-90deg, #e0e0e0 0%, #cfcfcf 50%, #e0e0e0 100%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }
  </style>
</head>
<body>
  <div class="skeleton-loader"></div>
</body>
</html>
